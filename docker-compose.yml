# Infraestructura local: PostgreSQL + Vault (modo dev) + carga inicial de secretos.
# Uso:  copiar .env.example a .env, completar valores y ejecutar `docker compose up -d`

services:
  postgres:
    image: postgres:17
    ports: ["127.0.0.1:5432:5432"] # solo este PC, nunca la red (Wi-Fi público)
    environment:
      POSTGRES_DB: cv_app
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d cv_app"]
      interval: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.18
    ports: ["127.0.0.1:8200:8200"] # solo este PC, nunca la red
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN}
      VAULT_ADDR: http://127.0.0.1:8200
    command: server -dev -dev-listen-address=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      retries: 10

  # Vault en modo dev guarda todo en memoria: este servicio vuelve a cargar los secretos en cada arranque
  vault-seed:
    image: hashicorp/vault:1.18
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_TOKEN}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./.vault/seed.sh:/seed.sh:ro
    entrypoint: ["sh", "/seed.sh"]
    restart: "no"

volumes:
  postgres-data:
