# Vigilancia de vulnerabilidades y versiones (DEPLOY.md, "Seguridad de dependencias").
# Las alertas y los PR de seguridad llegan en cuanto se publica una vulnerabilidad que afecta a lo que usamos
# (requiere "Dependabot alerts" y "Dependabot security updates" activos en Settings → Code security).
# Además, una vez por semana propone las actualizaciones normales, agrupadas para no llenar de PR el repositorio.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Van atados a otra pieza: TypeScript, a la versión que soporta Angular; @types/node, al Node 22 que corre
    # en el VPS. Sus saltos mayores se hacen a mano, junto con esa pieza.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      backend-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Van atados a otra pieza: TypeScript, a la versión que soporta Angular; @types/node, al Node 22 que corre
    # en el VPS. Sus saltos mayores se hacen a mano, junto con esa pieza.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # Angular se actualiza entero o no se actualiza: sus paquetes deben ir en la misma versión
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular']
      storybook:
        patterns: ['storybook', '@storybook/*']
      frontend-menores:
        update-types: [minor, patch]

  # Imágenes del VPS (postgres, node, caddy). Los saltos de versión mayor se hacen a mano:
  # Postgres necesita volcar y restaurar la base, y Node cambia de LTS.
  - package-ecosystem: docker-compose
    directory: /deploy/vps
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      acciones:
        patterns: ['*']
