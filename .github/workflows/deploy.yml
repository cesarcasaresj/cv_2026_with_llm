# Pruebas en cada pull request y despliegue al VPS en cada cambio en main. Guía: DEPLOY.md
#
# Se compila aquí, no en el servidor: al VPS solo llegan el backend en un archivo (dist/server.mjs), sus migraciones,
# el frontend ya compilado y la configuración de Docker Compose (deploy/vps). Allí lo ejecutan imágenes oficiales.
# Ninguna credencial está en este archivo: todas son Secrets del repositorio (Settings → Secrets and variables).

name: Pruebas y despliegue

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos despliegues a la vez; el que está en marcha termina
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend · contrato, tipos, pruebas y compilación
        working-directory: backend
        run: |
          npm ci
          npm run generate:api
          npm run typecheck
          npm test
          npm run build
          npm run build:images

      - name: Frontend · contrato y compilación
        working-directory: frontend
        run: |
          npm ci
          npm run generate:api
          npm run build

      - name: Preparar el paquete para el servidor
        run: |
          mkdir -p release/api/dist release/api/db release/web
          cp backend/dist/server.mjs backend/dist/server.mjs.map release/api/dist/
          cp -r backend/db/init release/api/db/init
          cp -r frontend/dist/frontend/server frontend/dist/frontend/browser release/web/
          cp deploy/vps/compose.yml deploy/vps/Caddyfile deploy/vps/backup.sh release/

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release
          retention-days: 7

  deploy:
    name: Despliegue en el VPS
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_DIR: /opt/cv
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Huella del servidor guardada de antemano: si cambia, la conexión se rechaza (evita suplantaciones)
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Subir backend, frontend y configuración
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $SSH_PORT"
          # --delete quita los archivos de la versión anterior
          rsync -az --delete -e "$SSH" release/api/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/release/api/"
          rsync -az --delete -e "$SSH" release/web/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/release/web/"
          rsync -az -e "$SSH" release/compose.yml release/Caddyfile release/backup.sh "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"

      - name: Reiniciar las aplicaciones
        run: |
          # up -d aplica los cambios de compose.yml; restart carga los archivos nuevos (el backend migra al arrancar)
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_DIR' && chmod +x backup.sh && docker compose up -d --remove-orphans && docker compose restart api && docker compose restart web && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile"

      - name: Comprobar que el sitio responde
        if: vars.SITE_URL != ''
        run: |
          # La API se comprueba como la usan los visitantes: a través del sitio (HTTPS), que la reenvía al backend
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$SITE_URL/api/v1/posts/count" > /dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors "$SITE_URL/" > /dev/null
          echo "✓ $SITE_URL y su API responden"
