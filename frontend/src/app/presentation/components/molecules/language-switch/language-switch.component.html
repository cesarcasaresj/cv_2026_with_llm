<!-- Nombre accesible "ES Español" / "EN English": empieza por el texto visible, como pide WCAG 2.5.3 -->
<div
  class="language-switch"
  [class.language-switch--en]="lang() === 'en'"
  [class.language-switch--on-night]="onNight()"
  role="group"
  [attr.aria-label]="i18n.t().language.label"
>
  <span class="language-switch__pill" aria-hidden="true">
    <!-- La bandera del idioma activo; se crea de nuevo al cambiar para girar en 3D -->
    @for (current of [lang()]; track current) {
      <span class="language-switch__flag" [style.background-image]="flag()"></span>
    }
  </span>
  @for (option of options; track option) {
    <button
      type="button"
      class="language-switch__option"
      [attr.lang]="option"
      [attr.aria-pressed]="lang() === option"
      (click)="choose(option)"
    >
      {{ option.toUpperCase() }}<span class="cdk-visually-hidden"> {{ i18n.t().language.names[option] }}</span>
    </button>
  }

  <!-- Celebración del cambio: confeti con los colores de la bandera y un saludo (decorativos) -->
  @if (celebration(); as party) {
    @for (play of [party.run]; track play) {
      <span class="language-switch__burst" [class.language-switch__burst--big]="party.big" aria-hidden="true">
        @for (piece of pieces(); track piece.index) {
          <span class="language-switch__piece" [style.--p]="piece.index" [style.--c]="piece.color"></span>
        }
        <span class="language-switch__bubble" [attr.lang]="party.lang">{{ greeting() }}</span>
      </span>
    }
  }
</div>
