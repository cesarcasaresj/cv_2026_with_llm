<section class="post-counter" aria-labelledby="post-counter-title" [attr.aria-busy]="posts.isLoading()">
  <h2 id="post-counter-title" class="post-counter__label">{{ t().postCounter.title }}</h2>

  @if (posts.isLoading()) {
    <p class="post-counter__value post-counter__value--loading">{{ t().postCounter.loading }}</p>
  } @else if (posts.error()) {
    <p class="post-counter__value post-counter__value--error">
      {{ t().postCounter.error }}
    </p>
  } @else if (posts.value(); as data) {
    <p class="post-counter__value">{{ data.total }}</p>
  }
</section>
