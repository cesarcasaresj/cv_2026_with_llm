<section id="sobre-mi" class="about" tabindex="-1" aria-labelledby="sobre-mi-title">
  <div class="about__glow" aria-hidden="true"></div>
  <div class="about__inner l-container">
    <app-section-heading index="01" [title]="t().about.title" headingId="sobre-mi-title" />

    @switch (state()) {
      @case ('loading') {
        <p>{{ t().about.loading }}</p>
      }
      @case ('error') {
        <p>{{ t().about.error }}</p>
      }
      @default {
        @let current = profile()!;
        <div class="about__layout">
          <app-player-card
            class="about__card"
            [name]="current.name"
            [role]="role()"
            [alt]="t().about.portraitAlt(current.name)"
            [image]="portrait"
          />

          <!-- Todo el texto a la vista: un reclutador no debería tener que pulsar "Siguiente" para leerlo -->
          <div class="about__text">
            @for (paragraph of current.about; track $index) {
              <p class="about__paragraph" [class.about__paragraph--lead]="$first">{{ paragraph }}</p>
            }
          </div>
        </div>

      }
    }
  </div>
</section>
