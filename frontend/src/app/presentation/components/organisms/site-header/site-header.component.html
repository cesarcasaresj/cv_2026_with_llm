<header class="site-header">
  <div class="site-header__inner">
    <a class="site-header__brand" routerLink="/" fragment="inicio" [attr.aria-label]="t().header.brandLabel">
      <span class="site-header__logo" aria-hidden="true">◆</span>
      <span class="site-header__brand-text">{{ siteName }}</span>
    </a>

    <nav
      class="site-header__nav"
      [attr.aria-label]="t().header.navLabel"
      (pointerenter)="portals.warmUp()"
      (focusin)="portals.warmUp()"
    >
      <ul class="site-header__list">
        @for (item of items(); track item.fragment) {
          <li class="site-header__item">
            <a
              class="site-header__link"
              [routerLink]="item.path"
              [fragment]="item.fragment"
              (click)="activate(item.section, $event)"
            >
              <span class="site-header__icon" aria-hidden="true">{{ icons[item.section] }}</span>
              <app-nav-label [text]="item.label" [section]="item.section" [run]="effectRun(item.section)" />
              <app-nav-preview class="site-header__preview" [section]="item.section" />
            </a>
          </li>
        }
        <li class="site-header__item">
          <a
            class="site-header__link site-header__link--blog"
            routerLink="/blog"
            routerLinkActive="site-header__link--active"
            ariaCurrentWhenActive="page"
            (click)="activate('blog', $event)"
          >
            <span class="site-header__icon" aria-hidden="true">{{ icons.blog }}</span>
            <app-nav-label [text]="t().header.blog" section="blog" [run]="effectRun('blog')" />
            <app-nav-preview class="site-header__preview" section="blog" />
          </a>
        </li>
      </ul>
    </nav>

    <!-- Clima del visitante (HU-25): solo en el navegador; se descarga cuando el navegador queda libre -->
    <div class="site-header__weather">
      @defer (on idle) {
        <app-weather-host />
      }
    </div>
    <app-language-switch class="site-header__language" [lang]="i18n.lang()" (selected)="changeLang($event)" />
    <app-theme-toggle class="site-header__theme" [dark]="theme.theme() === 'dark'" (toggled)="theme.toggle($event)" />
    <!-- El CV en PDF, siempre a mano arriba a la derecha (donde lo busca un reclutador) -->
    <a class="site-header__cv" [href]="pdfUrl" download [attr.aria-label]="t().cv.download">
      <span aria-hidden="true">↓</span>&nbsp;<span aria-hidden="true">CV</span>
    </a>
  </div>
  <!-- Barra de progreso de lectura: decorativa, solo en navegadores con animaciones ligadas al scroll -->
  <span class="site-header__progress" aria-hidden="true"></span>
</header>

<!-- Bandera del idioma elegido (HU-21): decorativa, el cambio ya se anuncia con texto -->
@if (flagRun()) {
  <app-language-flag [lang]="flagLang()" [run]="flagRun()" />
}
