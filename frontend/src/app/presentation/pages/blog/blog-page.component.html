<header class="blog__header">
  <h1>{{ t().blog.title }}</h1>
  <p class="blog__intro">{{ t().blog.intro }}</p>
</header>

<app-post-counter />

<div class="blog__filters">
  <app-taxonomy-filter
    [heading]="t().blog.categories"
    endpoint="/api/v1/categories"
    queryParam="categoria"
    [selectedSlug]="categoria() ?? null"
  />
  <app-taxonomy-filter [heading]="t().blog.tags" endpoint="/api/v1/tags" queryParam="etiqueta" [selectedSlug]="etiqueta() ?? null" />
</div>

<app-post-list [category]="categoria() ?? null" [tag]="etiqueta() ?? null" />
