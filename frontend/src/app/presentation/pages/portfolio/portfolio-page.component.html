<app-hero-section [profile]="loadedProfile()" [state]="profileState()" />

<!-- Primero quién soy; después la experiencia, que es lo que más busca un reclutador -->
<app-about-section [profile]="loadedProfile()" [state]="profileState()" [projectCount]="loadedProjects()?.length ?? null" />

<app-experience-journey [positions]="loadedProfile()?.experience ?? null" [state]="profileState()" />

<!-- Habilidades, educación, idiomas y el PDF: el resto del CV (HU-26) -->
<app-cv-details [profile]="loadedProfile()" [state]="profileState()" />

<app-project-grid [projects]="loadedProjects()" [state]="projectsState()" [githubUrl]="loadedProfile()?.links?.github ?? null" />

@if (hasUpdates() || updates.error()) {
  <app-update-feed
    [updates]="updates.hasValue() ? updates.value() : null"
    [state]="updatesState()"
    [linkedinUrl]="loadedProfile()?.links?.linkedin ?? null"
  />
}

<!-- Puente al blog: también es una sección navegable, con su propio encabezado -->
<section class="blog-teaser" aria-labelledby="blog-teaser-title">
  <div class="blog-teaser__inner l-container" appReveal>
    <h2 id="blog-teaser-title" class="blog-teaser__title">{{ t().teaser.title }}</h2>
    <p class="blog-teaser__text">{{ t().teaser.text }}</p>
    <a class="blog-teaser__cta" routerLink="/blog">{{ t().teaser.cta }} <span aria-hidden="true">→</span></a>
  </div>
</section>

<!-- Pregúntale a mi CV (HU-24): botón flotante, solo si el asistente está disponible -->
@if (loadedProfile(); as current) {
  <!-- Se descarga cuando el navegador queda libre: no pesa en la carga inicial -->
  @defer (on idle) {
    <app-cv-assistant-host [name]="current.name.split(' ')[0]" [linkedinUrl]="current.links.linkedin" />
  }
}
