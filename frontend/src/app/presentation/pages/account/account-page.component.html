<h1>{{ t().account.title }}</h1>
<app-session-info
  [user]="user.hasValue() ? user.value() : null"
  [pending]="loggingOut()"
  [errorMessage]="errorMessage()"
  (loggedOut)="logout()"
/>
<nav [attr.aria-label]="t().account.manageLabel">
  <ul class="account-page__links">
    <li><a routerLink="/cuenta/categorias">{{ t().account.categoriesLink }}</a></li>
  </ul>
</nav>
